name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o pinchpass-${{ matrix.name }} .
      - uses: actions/upload-artifact@v4
        with:
          name: pinchpass-${{ matrix.name }}
          path: pinchpass-${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pinchpass-*
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: pinchpass-*
          generate_release_notes: true

  publish-npm:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write  # OIDC — npm Trusted Publishing + provenance (no long-lived token)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish @pinchpass/cli (Trusted Publishing)
        working-directory: plugins/pinchpass
        run: |
          npm install -g npm@11 --no-audit --no-fund
          npm install --ignore-scripts --no-audit --no-fund
          # DEBUG: dump the OIDC claims GitHub issued
          IDTOKEN=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const p=JSON.parse(Buffer.from(j.value.split('.')[1],'base64').toString());console.log(JSON.stringify(p,null,1))}")
          echo "OIDC CLAIMS: $IDTOKEN"
          CURRENT=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$CURRENT" != "$TAG" ]; then
            npm version "$TAG" --no-git-tag-version
          fi
          npm publish --provenance --access public --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
