name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required for the changelog and version metadata.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT (or GitHub App token) with contents:write on
          # rubybear-lgtm/homebrew-tap. The default GITHUB_TOKEN cannot push
          # to another repository.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      id-token: write  # OIDC — npm Trusted Publishing + provenance (no long-lived token)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish @pinchpass/cli (Trusted Publishing)
        working-directory: plugins/pinchpass
        run: |
          npm install -g npm@11 --no-audit --no-fund
          npm install --ignore-scripts --no-audit --no-fund
          CURRENT=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$CURRENT" != "$TAG" ]; then
            npm version "$TAG" --no-git-tag-version
          fi
          npm publish --provenance --access public
